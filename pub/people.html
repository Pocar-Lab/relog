{% extends 'layout.html' %}

{% block content %}

<header>
    <h1>{{ title }}</h1>
</header>

<table>
    <tr>
        <th>Name</th>
        <th>Username</th>
        <th>E-Mail</th>
        <th>Role</th>
    </tr>
    {%- for p in people -%}
    <tr>
        <td><a href="/people/{{ p['user'] }}">{{ p['name'] }}</a></td>
        <td>{{ p['user'] }}</td>
        <td><a href="mailto:{{ p['email'] }}">{{ p['email'] }}</a></td>
        <td>{{ p['role'] | role_str }}</td>
    </tr>
    {%- endfor -%}
</table>

{% endblock %}
