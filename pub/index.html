<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/custom.css">
    <link rel="stylesheet" href="/font/fonts.css">
    <script src="/fixi.js"></script>
  </head>
  <body>
    <main>

      <header>
        <h1>Logbook</h1>
        <p>Simple logbook for recording daily lab notes</p>
        <h3>{{ title }}</h3>
        <a href='/?before={{prev_date}}&after={{prev_date}}'>Back</a>
        <a href='/?before={{curr_date}}&after={{curr_date}}'>Today</a>
        <a href='/?before={{next_date}}&after={{next_date}}'>Forward</a>
      </header>


      <details>
          <summary>Search</summary>
          <form action="/" method="GET" class="log-search">
              <input type="search" name="q" id="q" placeholder="Search Logs..." autocomplete="on" />
              <input type="submit" id="submit" value="Search" autocomplete="on" />
              <input type="text" name="num" id="num" placeholder="Number" autocomplete="on" />
              <input type="text" name="author" id="name" placeholder="Author" autocomplete="on" />
              <input type="text" name="after" id="after" placeholder="After Date" autocomplete="on" />
              <input type="text" name="before" id="before" placeholder="Before Date" autocomplete="on" />
          </form>
      </details>

      <log-entries>
          {%- for log in logs -%}
            <log-entry id="{{log[0]}}">
                <log-num>#{{ log[0] }}</log-num>
                <log-post> <!-- TODO change to details? -->
                    <log-header>
                        <log-authors>{{ log[2] }}</log-authors>
                        <log-datetime>{{ log[1] }}</log-datetime>
                    </log-header>
                    <hr>
                    <p>{{ log[3] }}</p>
                </log-post>
            </log-entry>
          {%- endfor -%}
      </log-entries>

      <hr style="padding: 2em;">

      <!-- TODO remove need for fixi by loading page with date and date anchor? -->
      <form fx-action="/log" fx-method="post" fx-target="log-entries"
            fx-swap="beforeend">
          <log-entry>
              <log-num>New Post</log-num>
              <log-post>
                  <log-header>
                      <log-authors>
                          <!-- TODO value="{{ username }}" -->
                          <input type="text" name="name" id="name" autocomplete="on"
                                 placeholder="Authors" required />
                      </log-authors>
                      <!-- TODO non current date -->
                      <log-datetime>Current time</log-datetime>
                  </log-header>
                  <hr>
                  <p>
                      <textarea name="message" id="message" rows="7"
                                placeholder="New log post..." required></textarea>
                      <label for="file">Attachments:
                          <input type="file" name="file" id="file" multiple />
                      </label>
                      <input type="submit" value="Submit" />
                  </p>
              </log-post>
          </log-entry>
      </form>

    </main>

  </body>
</html>
